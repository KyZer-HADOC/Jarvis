name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build Jarvis-Setup.exe
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python for source validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        shell: powershell
        run: |
          python -m compileall -q main.py ui.py doctor.py setup.py actions core dashboard memory plugins
          if ($LASTEXITCODE -ne 0) { throw "Python syntax validation failed." }

      - name: Smoke-test exact maths engine
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check "sympy>=1.12,<2"
          if ($LASTEXITCODE -ne 0) { throw "Could not install SymPy for the maths smoke test." }
          @'
          import json, subprocess, sys
          worker = "plugins/_mathworker.py"
          cases = [
              ({"op":"eval","expr":"2^10 + sqrt(144)"}, lambda r: r.get("exact") == "1036"),
              ({"op":"eval","expr":"sin(deg(30))"}, lambda r: r.get("exact") == "1/2"),
              ({"op":"solve","expr":"x^2 - 5x + 6 = 0","vars":["x"]},
               lambda r: "x = 2" in r.get("exact","") and "x = 3" in r.get("exact","") and r.get("verified") is True),
              ({"op":"diff","expr":"x^3 * sin(x)","var":"x"},
               lambda r: "x^3*cos(x)" in r.get("exact","").replace(" ","")),
              ({"op":"integrate","expr":"x^2","var":"x","lower":"0","upper":"3"},
               lambda r: r.get("exact") == "9"),
              ({"op":"det","a":"Matrix([[1,2],[3,4]])"}, lambda r: r.get("exact") == "-2"),
              ({"op":"eval","expr":"__import__('os').system('echo unsafe')"}, lambda r: not r.get("ok")),
          ]
          for op, check in cases:
              p = subprocess.run([sys.executable, worker], input=json.dumps({"ops":[op]}),
                                 text=True, capture_output=True, timeout=20)
              if p.returncode != 0: raise SystemExit(f"Math worker crashed: {p.stderr[-500:]}")
              try: r = json.loads(p.stdout)["results"][0]
              except Exception: raise SystemExit(f"Math worker returned invalid JSON: {p.stdout[-500:]}")
              if not check(r): raise SystemExit(f"Math smoke test failed for {op}: {r}")
          print(f"Passed {len(cases)} exact-math and hostile-input smoke tests.")
          '@ | Set-Content -Path .math-smoke.py -Encoding utf8
          python .math-smoke.py
          $status = $LASTEXITCODE
          Remove-Item .math-smoke.py -Force -ErrorAction SilentlyContinue
          if ($status -ne 0) { throw "Exact maths smoke test failed." }

      - name: Smoke-test plugin discovery
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check requests numpy pillow mss pyperclip
          if ($LASTEXITCODE -ne 0) { throw "Could not install the lightweight dependencies for plugin checks." }
          $env:JARVIS_NO_BACKGROUND = "1"
          @'
          import os
          from pathlib import Path
          os.environ["JARVIS_NO_BACKGROUND"] = "1"
          from core.plugin_loader import discover_plugins
          from core.action_loader import discover_actions
          root = Path("plugins")
          registry = discover_plugins(root, set(), logger=lambda s: print(s), notify=lambda s: None)
          action_registry = discover_actions(Path("actions"), set(), logger=lambda s: print(s))
          assert action_registry.has("open_creator_website"), "Creator website action failed discovery."
          from plugins import _translate
          assert _translate.normalize("Sinhala") == ("si", "Sinhala"), _translate.normalize("Sinhala")
          assert _translate.normalize("ta") == ("ta", "Tamil"), _translate.normalize("ta")
          assert _translate.normalize("English") == ("en", "English"), _translate.normalize("English")
          print("Translation language-code checks passed.")
          # Regression test for the exact voice request that previously got blocked.
          import ast, re
          main_tree = ast.parse(Path("main.py").read_text(encoding="utf-8"))
          helper_names = {
              "_extract_windows_path", "_extract_episode_count",
              "_is_episode_batch_request", "_is_subtitle_request",
              "_get_uploaded_media_reference"
          }
          helper_nodes = [node for node in main_tree.body
                          if isinstance(node, ast.FunctionDef) and node.name in helper_names]
          assert {node.name for node in helper_nodes} == helper_names, "Subtitle request helpers are missing."
          helper_ns = {"re": re, "Path": Path}
          exec(compile(ast.Module(body=helper_nodes, type_ignores=[]), "main.py", "exec"), helper_ns)
          spoken_request = r"E:\Anime\Boruto\Boruto TV Seiries\Boruto Clasic mula epi 5 he sinhala sub generate karanna"
          extracted_path = helper_ns["_extract_windows_path"](spoken_request)
          assert extracted_path == r"E:\Anime\Boruto\Boruto TV Seiries\Boruto Clasic", extracted_path
          assert helper_ns["_extract_episode_count"](spoken_request) == 5
          folder_followup = "e folder eka athule video files bara ganak thiye.ethanin mul episodes 5 he gen karanna"
          assert helper_ns["_is_episode_batch_request"](folder_followup)
          assert helper_ns["_is_subtitle_request"](folder_followup)
          assert helper_ns["_extract_episode_count"](folder_followup) == 5
          assert helper_ns["_extract_episode_count"]("ethanin mul episodes 3 he gen karanna") == 3
          assert helper_ns["_extract_episode_count"]("from there generate the first five episodes") == 5
          assert not helper_ns["_is_episode_batch_request"]("ethanin mul episodes gen karanna")
          assert helper_ns["_is_subtitle_request"]("generate sinhala sub")
          for harmless_followup in ("ela", "hmm", "hadawada", "nice ban"):
              assert not helper_ns["_is_subtitle_request"](harmless_followup), harmless_followup
          print("Boruto folder path, first-five-episodes intent and no-duplicate follow-up tests passed.")
          from plugins import video_toolkit
          assert sorted(["Boruto 10.mp4", "Boruto 2.mp4"], key=video_toolkit._natural_key) == ["Boruto 2.mp4", "Boruto 10.mp4"]
          print("Episode filename natural-order sorting passed.")
          # Existing generic Sinhala SRTs must attach to the movie's own basename,
          # stay Sinhala (not be translated to Sinhala a second time), and have
          # out-of-video/overlapping timestamps cleaned before delivery.
          assert video_toolkit._srt_contains_target_script("\\u0dc3\\u0dd2\\u0d82\\u0dc4\\u0dbd", "si")
          with tempfile.TemporaryDirectory() as srt_tmp:
              srt_root = Path(srt_tmp)
              generic_srt = srt_root / "sinhalasub.srt"
              movie_sidecar = srt_root / "Boruto 01.srt"
              generic_srt.write_text(
                  "1\n00:00:01,000 --> 00:00:03,000\nඔයා කොහෙද?\n\n"
                  "2\n00:00:02,500 --> 00:00:06,500\nමම මෙතන.\n\n"
                  "3\n00:00:08,000 --> 00:00:09,000\nඅන්තිම කොටස\n",
                  encoding="utf-8",
              )
              count, adjusted, skipped = video_toolkit._normalize_srt_timing(
                  generic_srt, movie_sidecar, 5.0
              )
              result_text = movie_sidecar.read_text(encoding="utf-8-sig")
              assert count == 2, (count, result_text)
              assert adjusted >= 2, (adjusted, result_text)
              assert skipped == 1, (skipped, result_text)
              assert "Boruto 01.srt" == movie_sidecar.name
              assert "00:00:05,000" in result_text
              assert "00:00:08,000" not in result_text
              assert "00:00:01,000 --> 00:00:02,460" in result_text
          print("Sinhala SRT attachment, filename and timing-sanity tests passed.")
          # A generic sinhalasub.srt should be usable for one video, but must
          # never be copied onto every episode if multiple videos share a folder.
          with tempfile.TemporaryDirectory() as generic_tmp:
              generic_root = Path(generic_tmp)
              generic_srt = generic_root / "sinhalasub.srt"
              generic_srt.write_text(
                  "1\n00:00:00,000 --> 00:00:01,000\nඔයා කොහෙද?\n",
                  encoding="utf-8",
              )
              first_video = generic_root / "Boruto 01.mp4"
              second_video = generic_root / "Boruto 02.mp4"
              first_video.write_bytes(b"mock")
              second_video.write_bytes(b"mock")
              assert video_toolkit._filter_ambiguous_generic_srt(
                  [generic_srt], first_video
              ) == []
          with tempfile.TemporaryDirectory() as single_video_tmp:
              single_root = Path(single_video_tmp)
              single_video = single_root / "Thor.mp4"
              generic_srt = single_root / "sinhalasub.srt"
              single_video.write_bytes(b"mock")
              generic_srt.write_text(
                  "1\n00:00:00,000 --> 00:00:01,000\nඔයා කොහෙද?\n",
                  encoding="utf-8",
              )
              result = video_toolkit._subtitles(
                  single_video,
                  {"ok": True, "has_audio": True, "duration": 5.0, "width": 1280, "height": 720},
                  {"target_language": "Sinhala"}, None, False
              )
              expected_sidecar = single_root / "Thor.srt"
              assert expected_sidecar.is_file(), (result, expected_sidecar)
              assert "Thor.srt" in result, result
              assert generic_srt.is_file(), "The generic source SRT should be preserved."
          print("Generic sinhalasub.srt matching tests passed: one-video reuse, multi-video protection, movie-name sidecar.")
          # A folder request with no episode count should process files naturally,
          # not reject the folder or pick just one largest file.
          with tempfile.TemporaryDirectory() as batch_tmp:
              batch_root = Path(batch_tmp)
              for filename in ("Boruto 10.mp4", "Boruto 2.mp4", "Boruto 1.mp4"):
                  (batch_root / filename).write_bytes(b"mock video")
              calls = []
              old_video, old_subs = video_toolkit._video, video_toolkit._subtitles
              try:
                  video_toolkit._video = lambda name: (Path(name), {"mock": True})
                  video_toolkit._subtitles = lambda path, info, args, player, open_it: (
                      calls.append(path.name) or f"Done. Saved: {path.with_suffix('.srt')}"
                  )
                  class LogCapture:
                      def write_log(self, message): pass
                  batch_result = video_toolkit._subtitle_folder_batch(
                      batch_root, 0, {"target_language": "Sinhala"}, LogCapture()
                  )
                  assert calls == ["Boruto 1.mp4", "Boruto 2.mp4", "Boruto 10.mp4"], calls
                  assert "3/3 episode(s) completed" in batch_result, batch_result
              finally:
                  video_toolkit._video, video_toolkit._subtitles = old_video, old_subs
          print("No-count subtitle folder batch and natural ordering tests passed.")
          # Regression test: a missing Boruto path must never resolve to a Naruto
          # file merely because that is the only movie in a common user folder.
          import tempfile
          from plugins import _media, subtitle_translate as _st
          # Regression for FILE: <name> loaded -> "generate sinhala sub".
          # JarvisUI stores the chosen path as _current_file; FileDropZone uses
          # current_file(). Both representations must resolve to the exact file.
          with tempfile.TemporaryDirectory() as upload_tmp:
              uploaded = Path(upload_tmp) / "01 - Boruto Uzumaki!.mp4"
              uploaded.write_bytes(b"test upload")
              fake_ui = type("FakeUI", (), {"_current_file": str(uploaded)})()
              assert helper_ns["_get_uploaded_media_reference"](fake_ui) == str(uploaded)
              fake_zone = type("FakeDropZone", (), {
                  "current_file": lambda self: str(uploaded)
              })()
              zone_ui = type("FakeZoneUI", (), {"_drop_zone": fake_zone})()
              assert helper_ns["_get_uploaded_media_reference"](zone_ui) == str(uploaded)
          print("Uploaded-video follow-up reference tests passed (_current_file and FileDropZone).")
          # A previously saved first episode-chunk translation must be reused as a
          # prefix when the growing source transcript contains more timestamped cues.
          with tempfile.TemporaryDirectory() as tmp:
              prefix_root = Path(tmp)
              growing_source = prefix_root / "growing-source.srt"
              existing_sidecar = prefix_root / "growing.srt"
              growing_source.write_text(
                  "1\n00:00:00,000 --> 00:00:01,000\nHello\n\n"
                  "2\n00:00:01,000 --> 00:00:02,000\nWorld\n",
                  encoding="utf-8",
              )
              existing_sidecar.write_text(
                  "1\n00:00:00,000 --> 00:00:01,000\nආයුබෝවන්\n",
                  encoding="utf-8",
              )
              parsed, positions, original = _st._parse(_st._read_text(growing_source))
              assert _st._compatible_existing(existing_sidecar, parsed, original) == ["ආයුබෝවන්", "World"]
          print("Growing-SRT translation checkpoint resume passed.")
          with tempfile.TemporaryDirectory() as tmp:
              test_root = Path(tmp)
              fake_home = test_root / "home"
              (fake_home / "Videos").mkdir(parents=True)
              (fake_home / "Videos" / "Naruto - 001.mp4").write_bytes(b"unrelated video")
              source_dir = test_root / "Boruto"
              source_dir.mkdir()
              old_home, old_search_dirs = _media.HOME, _media._SEARCH_DIRS
              _media.HOME, _media._SEARCH_DIRS = fake_home, ("Videos",)
              try:
                  try:
                      _media.resolve_file(str(source_dir / "Boruto - 291.mp4"), {".mp4"})
                  except _media.MediaError:
                      pass
                  else:
                      raise AssertionError("Missing explicit Boruto path resolved to an unrelated video.")
                  try:
                      _media.resolve_file("Boruto - 291.mp4", {".mp4"})
                  except _media.MediaError:
                      pass
                  else:
                      raise AssertionError("Bare Boruto filename resolved to an unrelated video.")
                  # A folder containing several videos must never silently pick its largest file.
                  many = test_root / "Boruto Episodes"
                  many.mkdir()
                  (many / "Boruto 1.mp4").write_bytes(b"episode one")
                  (many / "Boruto 2.mp4").write_bytes(b"episode two is bigger")
                  try:
                      _media.resolve_file(str(many), {".mp4"})
                  except _media.MediaError:
                      pass
                  else:
                      raise AssertionError("Ambiguous episode folder silently selected a video.")
                  wanted = source_dir / "Boruto - 291.mp4"
                  wanted.write_bytes(b"the requested video")
                  assert _media.resolve_file(str(wanted), {".mp4"}) == wanted.resolve()
              finally:
                  _media.HOME, _media._SEARCH_DIRS = old_home, old_search_dirs
          print("Media path regression tests passed: missing Boruto never resolves to Naruto.")
          items = registry.list_for_ui()
          invalid = [p for p in items if not p.get("valid")]
          print(f"Discovered {len(items)} plugin files.")
          for p in items:
              print(f"{'OK' if p.get('valid') else 'BROKEN'}: {p.get('name')} ({p.get('file')})"
                    + (f" — {p.get('error')}" if p.get('error') else ""))
          if invalid:
              raise SystemExit(f"{len(invalid)} plugin(s) failed discovery.")
          '@ | Set-Content -Path .plugin-smoke.py -Encoding utf8
          python .plugin-smoke.py
          $status = $LASTEXITCODE
          Remove-Item .plugin-smoke.py -Force -ErrorAction SilentlyContinue
          if ($status -ne 0) { throw "Plugin discovery smoke test failed." }

      - name: Verify installer inputs
        shell: powershell
        run: |
          $required = @(
            "main.py",
            "requirements.txt",
            "LICENSE",
            "jarvis.ico",
            "config\jarvis.ico",
            "installer\Jarvis.iss",
            "installer\bootstrap.ps1"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Required installer input is missing: $path" }
          }

      - name: Validate PowerShell bootstrap syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "installer\bootstrap.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.ToString() }
            throw "PowerShell bootstrap syntax validation failed."
          }
          Write-Host "PowerShell bootstrap syntax passed."

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Compile the installer
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $ver = "1.0.$env:GITHUB_RUN_NUMBER"
          }
          & $iscc "/DAppVersion=$ver" "installer\Jarvis.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-Item "installer\Output\Jarvis-Setup.exe" | Format-List Name, Length

      - name: Upload setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Setup
          path: installer/Output/Jarvis-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/Jarvis-Setup.exe
          generate_release_notes: true
