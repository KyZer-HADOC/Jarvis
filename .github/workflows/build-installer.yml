name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build Jarvis-Setup.exe
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python for source validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        shell: powershell
        run: |
          python -m compileall -q main.py ui.py doctor.py setup.py actions core dashboard memory plugins
          if ($LASTEXITCODE -ne 0) { throw "Python syntax validation failed." }

      - name: Verify installer inputs
        shell: powershell
        run: |
          $required = @(
            "main.py",
            "requirements.txt",
            "LICENSE",
            "config\jarvis.ico",
            "installer\Jarvis.iss",
            "installer\bootstrap.ps1"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Required installer input is missing: $path" }
          }

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Compile the installer
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $ver = "1.0.$env:GITHUB_RUN_NUMBER"
          }
          & $iscc "/DAppVersion=$ver" "installer\Jarvis.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-Item "installer\Output\Jarvis-Setup.exe" | Format-List Name, Length

      - name: Upload setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Setup
          path: installer/Output/Jarvis-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/Jarvis-Setup.exe
          generate_release_notes: true
