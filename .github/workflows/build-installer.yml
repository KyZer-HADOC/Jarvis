name: Build Windows installer

# Run it by hand:  Actions tab -> "Build Windows installer" -> Run workflow
#   -> when it finishes, download Jarvis-Setup from the "Artifacts" box at the bottom of the run.
# Or publish a downloadable release:  git tag v1.0.0 && git push origin v1.0.0
#   -> Jarvis-Setup.exe is attached to the GitHub Release automatically.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write   # needed only to attach the installer to a Release on tag builds

jobs:
  smoke-test:
    name: Requirements install on a clean Windows machine
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Exercises the very same script the installer runs: find Python, create venv, pip install -r requirements.txt.
      - name: Run installer\bootstrap.ps1
        shell: powershell
        run: ./installer/bootstrap.ps1 -AppDir "$env:GITHUB_WORKSPACE" -SkipBrowsers

      - name: Core packages import
        shell: cmd
        run: venv\Scripts\python.exe -c "import PyQt6.QtWidgets, numpy, requests, cv2, psutil, bs4, PIL; from google import genai; print('core imports ok')"

      - name: Every source file compiles
        shell: cmd
        run: venv\Scripts\python.exe -m compileall -q main.py ui.py core actions plugins memory config dashboard

      - name: Plugins load with the real loader
        shell: cmd
        run: venv\Scripts\python.exe -c "from pathlib import Path; from core.plugin_loader import discover_plugins; r = discover_plugins(Path('plugins'), core_tool_names=set(), logger=print); bad = [x for x in r.list_for_ui() if not x['valid']]; print('invalid plugins:', bad); raise SystemExit(1 if bad else 0)"

  build:
    name: Build Jarvis-Setup.exe
    needs: smoke-test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Compile the installer
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $ver = $env:GITHUB_REF_NAME.TrimStart('v') } else { $ver = "1.0.$env:GITHUB_RUN_NUMBER" }
          & $iscc "/DAppVersion=$ver" "installer\Jarvis.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-Item installer\Output\Jarvis-Setup.exe | Format-List Name, Length

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Setup
          path: installer/Output/Jarvis-Setup.exe
          if-no-files-found: error

      - name: Attach to the GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/Jarvis-Setup.exe
          generate_release_notes: true
